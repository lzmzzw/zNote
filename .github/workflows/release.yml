name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # 先取得唯一 Release，矩阵仅上传产物，避免重复创建及 latest.json 竞态。
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release-id: ${{ steps.release.outputs.release-id }}
    steps:
      - name: Create or reuse release
        id: release
        uses: actions/github-script@v7
        env:
          TAG_NAME: ${{ github.ref_name }}
        with:
          script: |
            const tag = process.env.TAG_NAME;
            const { owner, repo } = context.repo;
            let release;
            try {
              release = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
            } catch (error) {
              if (error.status !== 404) throw error;
              try {
                release = await github.rest.repos.createRelease({
                  owner,
                  repo,
                  tag_name: tag,
                  name: `zNote ${tag}`,
                  body: 'zNote Windows 与 macOS arm64 版本；更新包使用 Tauri updater 签名。',
                  draft: false,
                  prerelease: false,
                });
              } catch (createError) {
                // gh 可能同时发布同一 tag；422 后只复用确实已存在的 Release。
                if (createError.status !== 422) throw createError;
                release = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
              }
            }
            core.setOutput('release-id', String(release.data.id));

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
            config: ''
          - os: macos-latest
            target: aarch64-apple-darwin
            # app 是 updater 归档的来源，单独打 dmg 不会生成更新包及签名。
            bundles: app,dmg
            config: --config src-tauri/tauri.macos.conf.json
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: 8.10.0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: node --test scripts/release-updater.check.cjs
      - name: Build and upload signed installer
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          releaseId: ${{ needs.create-release.outputs.release-id }}
          tagName: ${{ github.ref_name }}
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} ${{ matrix.config }}
          # 矩阵仅上传各平台包和 .sig，两端成功后只汇总一次 latest.json。
          uploadUpdaterJson: false
          uploadUpdaterSignatures: true

  merge-updater-json:
    needs: [create-release, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Merge updater metadata from all platform assets
        uses: actions/github-script@v7
        env:
          TAG_NAME: ${{ github.ref_name }}
        with:
          script: |
            const { createUpdaterMetadata } = require('./scripts/release-updater.cjs');
            const { owner, repo } = context.repo;
            const tag = process.env.TAG_NAME;
            const release = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, {
              owner, repo, release_id: release.data.id, per_page: 100,
            });

            const download = async (asset) => {
              const response = await github.request('GET /repos/{owner}/{repo}/releases/assets/{asset_id}', {
                owner, repo, asset_id: asset.id,
                headers: { accept: 'application/octet-stream' },
              });
              return Buffer.isBuffer(response.data)
                ? response.data.toString('utf8')
                : Buffer.from(response.data).toString('utf8');
            };
            // macOS 更新包为 .app.tar.gz，Windows 直接使用 NSIS setup.exe。
            const latest = await createUpdaterMetadata({
              tag,
              assets,
              readSignature: download,
              notes: release.data.body ?? '',
              publishedAt: new Date().toISOString(),
            });

            const old = assets.find(a => a.name === 'latest.json');
            if (old) {
              await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: old.id });
            }
            const data = Buffer.from(JSON.stringify(latest, null, 2) + '\n');
            await github.rest.repos.uploadReleaseAsset({
              owner,
              repo,
              release_id: release.data.id,
              name: 'latest.json',
              data,
              headers: { 'content-type': 'application/json', 'content-length': data.length },
            });
